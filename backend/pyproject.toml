[project]
name = "app"
version = "0.1.0"
description = "Sistema Integral de Gestión y Automatización de Parqueaderos."
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2,<1.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.47",
    "loguru>=0.7.3",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "slowapi>=0.1.10",
    "ultralytics>=8.4.177",
    "paddleocr>=3.7.0",
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cu130 = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.fastapi]
entrypoint = "src.server.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
