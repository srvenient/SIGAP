services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ./backend
      target: production
      args:
        DEVICE_TYPE: ${DEVICE_TYPE}
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy # Espera a que PostgreSQL inicie para arrancar FastAPI
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api # Nginx redirigirá esto al contenedor "api"
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data_prod: